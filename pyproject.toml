[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-ai"
version = "0.1.0"
description = "让不同AI工具之间无缝交接工作的小工具"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "梅超"}]
keywords = ["ai", "mcp", "handoff", "collaboration", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # 上界是必要的：mcp 2.x 把高层入口 FastMCP 改名为 MCPServer，
    # 低层 Server 也不再提供 list_tools/call_tool 装饰器。
    # 本项目的 mcp_server.py 同时兼容 1.x 与 2.x，但 2.x 要求 Python >= 3.10，
    # 因此 Python 3.9 环境仍需 1.x。
    "mcp>=1.0.0,<3",
]

[project.scripts]
handoff = "handoff.cli:main"

[tool.setuptools.packages.find]
include = ["handoff*"]
