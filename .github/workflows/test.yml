name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # tests/test_full.py uses only the stdlib; it inserts the repo root on
      # sys.path itself, so no install step (and no MCP dependency) is needed.
      - name: Run full test suite
        run: python tests/test_full.py

  # The MCP server must work with both major mcp releases:
  # 1.x exposes FastMCP, 2.x renamed it to MCPServer.
  # mcp 2.x requires Python >= 3.10, so the 1.x lane covers 3.9 as well.
  mcp-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            mcp-spec: "mcp>=1.0.0,<2"
          - python-version: "3.11"
            mcp-spec: "mcp>=1.0.0,<2"
          - python-version: "3.13"
            mcp-spec: "mcp>=1.0.0,<2"
          - python-version: "3.11"
            mcp-spec: "mcp>=2.0.0,<3"
          - python-version: "3.13"
            mcp-spec: "mcp>=2.0.0,<3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mcp ${{ matrix.mcp-spec }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.mcp-spec }}"
      - name: Run MCP compatibility tests
        run: python tests/test_mcp_compat.py
