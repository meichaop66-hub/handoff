name: Publish to PyPI

# Publishing is an external side effect: this workflow never runs on push.
# Trigger it only by publishing a GitHub Release, or manually via workflow_dispatch.
#
# Before the first run, configure PyPI Trusted Publishing (OIDC) for this repo:
#   PyPI -> Account settings -> Publishing -> Add a new pending publisher
#     PyPI project name: handoff-ai
#     Owner: meichaop66-hub   Repository: handoff
#     Workflow name: publish-pypi.yml   Environment name: pypi
# Then create the "pypi" environment in the GitHub repo settings.
# No API token is stored or required.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
